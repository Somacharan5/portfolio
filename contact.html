<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Soma Charan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>document.documentElement.classList.add('mo');</script>
</head>
<body class="subpage">
  <div class="rails" aria-hidden="true"></div>
  <div id="nav"></div>
  <main class="page-wrap">
    <section class="page-hero">
      <span class="eyebrow">Contact</span>
      <h1 class="page-title">Project, Role or <span class="grad-pink ital">Just a Hey?</span></h1>
    </section>
    <div class="page-body">
      <div class="contact-tabs reveal">
        <div class="ct-toggle">
          <button class="ct-tab active" data-panel="panelCall"><svg class="icon"><use href="#i-calendar"/></svg> Book a Call</button>
          <button class="ct-tab" data-panel="panelMsg"><svg class="icon"><use href="#i-message-circle"/></svg> Send Message</button>
        </div>
        <div class="ct-socials">
          <a href="#" aria-label="Email"><svg class="icon"><use href="#i-mail"/></svg></a><a href="#" aria-label="LinkedIn"><svg class="icon"><use href="#i-briefcase"/></svg></a><a href="#" aria-label="GitHub"><svg class="icon"><use href="#i-git-branch"/></svg></a><a href="#" aria-label="X"><svg class="icon"><use href="#i-send"/></svg></a>
        </div>
      </div>

      <div class="ct-panel active reveal" id="panelCall">
        <div id="cal-inline"></div>
        <p class="center-note">Pick a slot that works for you — scheduling by Cal.com.</p>
      </div>

      <div class="ct-panel reveal" id="panelMsg">
        <form class="form-card" id="contactForm">
          <!-- Web3Forms: paste your free access key here (see below) -->
          <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY" />
          <input type="hidden" name="subject" value="New message from your portfolio" />
          <input type="hidden" name="from_name" value="Soma Charan Portfolio" />
          <input type="checkbox" name="botcheck" tabindex="-1" style="position:absolute;left:-9999px" aria-hidden="true" />
          <div class="form-row">
            <div class="field"><label>Name</label><input type="text" name="name" placeholder="Jane Doe" required /></div>
            <div class="field"><label>Email</label><input type="email" name="email" placeholder="jane@example.com" required /></div>
          </div>
          <div class="field"><label>Topic</label>
            <select name="topic"><option>Full-time role</option><option>Product consulting</option><option>Just saying hi</option><option>Something else</option></select>
          </div>
          <div class="field"><label>Message</label><textarea name="message" placeholder="Tell me about your project, role, or just say hi..." required></textarea></div>
          <label class="consent"><input type="checkbox" checked required /> I agree to the processing of my data to handle this request.</label>
          <button class="btn btn-pill" type="submit">Send Message
            <span class="btn-arrow"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h13M12 6l6 6-6 6"/></svg></span></button>
        </form>
      </div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="motion.umd.js"></script>
  <script src="sprite.js"></script>
  <script src="components.js"></script>
  <script src="script.js"></script>

  <style>#cal-inline{min-height:640px;width:100%;border:1px solid var(--border);border-radius:12px;overflow:hidden}</style>
  <!-- Cal.com inline booking (cal.com/somacharan) -->
  <script>
  (function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if (typeof namespace === "string") { cal.ns[namespace] = cal.ns[namespace] || api; p(cal.ns[namespace], ar); p(cal, ["initNamespace", namespace]); } else p(cal, ar); return; } p(cal, ar); }; })(window, "https://app.cal.com/embed/embed.js", "init");
  Cal("init", { origin: "https://cal.com" });
  Cal("inline", { elementOrSelector: "#cal-inline", calLink: "somacharan", layout: "month_view" });
  Cal("ui", { theme: "dark", styles: { branding: { brandColor: "#ff2d78" } }, hideEventTypeDetails: false, layout: "month_view" });
  </script>
  <!-- Contact form → Web3Forms (no backend needed) -->
  <script>
  (function () {
    const cf = document.getElementById('contactForm'); if (!cf) return;
    cf.addEventListener('submit', async (e) => {
      e.preventDefault();
      const key = cf.access_key.value, btn = cf.querySelector('button[type=submit]');
      if (!key || key.indexOf('YOUR_') === 0) { window.showToast && showToast('Almost there — add your Web3Forms key to enable sending.'); return; }
      btn.disabled = true; btn.style.opacity = .6;
      try {
        const res = await fetch('https://api.web3forms.com/submit', {
          method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(Object.fromEntries(new FormData(cf)))
        });
        const data = await res.json();
        window.showToast && showToast(data.success ? "Message sent — thanks! I'll get back to you soon." : "That didn't go through — please try again.");
        if (data.success) cf.reset();
      } catch { window.showToast && showToast('Network error — please try again.'); }
      btn.disabled = false; btn.style.opacity = '';
    });
  })();
  </script>
</body>
</html>
