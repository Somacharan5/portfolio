          <input type="hidden" name="access_key" value="f7296d9d-76f3-43ad-b884-86214e41250c" />

          <input type="hidden" name="from_name" value="Soma Charan Portfolio" />
          <input type="checkbox" name="botcheck" tabindex="-1" style="position:absolute;left:-9999px" aria-hidden="true" />
          <div class="form-row">
            <div class="field"><label>Name</label><input type="text" name="name" placeholder="Jane Doe" required /></div>

          <div class="field"><label>Topic</label>

          <div class="field"><label>Message</label><textarea name="message" placeholder="Tell me about your project, role, or just say hi..." required></textarea></div>

  <!-- Cal.com inline booking (cal.com/somacharan) -->
  <script>
  (function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if (typeof namespace === "string") { cal.ns[namespace] = cal.ns[namespace] || api; p(cal.ns[namespace], ar); p(cal, ["initNamespace", namespace]); } else p(cal, ar); return; } p(cal, ar); }; })(window, "https://app.cal.com/embed/embed.js", "init");
  Cal("init", { origin: "https://cal.com" });
  Cal("inline", { elementOrSelector: "#cal-inline", calLink: "somacharan", layout: "month_view" });
  Cal("ui", { theme: "dark", styles: { branding: { brandColor: "#ff2d78" } }, hideEventTypeDetails: false, layout: "month_view" });
  </script>
  <!-- Contact form → Web3Forms (no backend needed) -->
  <script>
  (function () {
    const cf = document.getElementById('contactForm'); if (!cf) return;
    cf.addEventListener('submit', async (e) => {
      e.preventDefault();
      const key = cf.access_key.value, btn = cf.querySelector('button[type=submit]');
      if (!key || key.indexOf('YOUR_') === 0) { window.showToast && showToast('Almost there — add your Web3Forms key to enable sending.'); return; }
      btn.disabled = true; btn.style.opacity = .6;
      try {
        const res = await fetch('https://api.web3forms.com/submit', {
          method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(Object.fromEntries(new FormData(cf)))
        });
        const data = await res.json();
        window.showToast && showToast(data.success ? "Message sent — thanks! I'll get back to you soon." : "That didn't go through — please try again.");
        if (data.success) cf.reset();
      } catch { window.showToast && showToast('Network error — please try again.'); }
      btn.disabled = false; btn.style.opacity = '';
    });
  })();
  </script>
