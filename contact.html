<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Soma Charan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>document.documentElement.classList.add('mo');</script>
</head>
<body class="subpage">
  <div class="rails" aria-hidden="true"></div>
  <div id="nav"></div>
  <main class="page-wrap">
    <section class="page-hero">
      <span class="eyebrow">Contact</span>
      <h1 class="page-title">Project, Role or <span class="grad-pink ital">Just a Hey?</span></h1>
    </section>
    <div class="page-body">
      <div class="contact-tabs reveal">
        <div class="ct-toggle">
          <button class="ct-tab active" data-panel="panelCall"><svg class="icon"><use href="#i-calendar"/></svg> Book a Call</button>
          <button class="ct-tab" data-panel="panelMsg"><svg class="icon"><use href="#i-message-circle"/></svg> Send Message</button>
        </div>
        <div class="ct-socials">
          <a href="#" aria-label="Email"><svg class="icon"><use href="#i-mail"/></svg></a><a href="#" aria-label="LinkedIn"><svg class="icon"><use href="#i-briefcase"/></svg></a><a href="#" aria-label="GitHub"><svg class="icon"><use href="#i-git-branch"/></svg></a><a href="#" aria-label="X"><svg class="icon"><use href="#i-send"/></svg></a>
        </div>
      </div>

      <div class="ct-panel active reveal" id="panelCall">
        <div class="cal-card">
          <div class="cal-side">
            <span class="av" style="--c1:#1e2b78;--c2:#5a6aef">S</span>
            <small>Soma Charan</small>
            <h3>30 Min Meeting</h3>
            <ul>
              <li><svg class="icon"><use href="#i-check"/></svg> Requires confirmation</li>
              <li><svg class="icon"><use href="#i-clock"/></svg> 30m</li>
              <li><svg class="icon"><use href="#i-video"/></svg> Google Meet</li>
              <li><svg class="icon"><use href="#i-globe"/></svg> Asia/Kolkata</li>
            </ul>
          </div>
          <div class="cal-main">
            <div class="cal-head"><b>July <em>2026</em></b>
              <div class="cal-nav"><button>‹</button><button>›</button></div></div>
            <div class="cal-grid">
              <span class="dow">Sun</span><span class="dow">Mon</span><span class="dow">Tue</span><span class="dow">Wed</span><span class="dow">Thu</span><span class="dow">Fri</span><span class="dow">Sat</span>
              <span></span><span></span><span></span>
              <span class="cal-day">1</span><span class="cal-day">2</span><span class="cal-day">3</span><span class="cal-day">4</span>
              <span class="cal-day">5</span><span class="cal-day">6</span><span class="cal-day">7</span><span class="cal-day">8</span><span class="cal-day">9</span><span class="cal-day today">10</span><span class="cal-day on">11</span>
              <span class="cal-day">12</span><span class="cal-day on">13</span><span class="cal-day on">14</span><span class="cal-day on">15</span><span class="cal-day on">16</span><span class="cal-day on">17</span><span class="cal-day on">18</span>
              <span class="cal-day">19</span><span class="cal-day on">20</span><span class="cal-day on">21</span><span class="cal-day on">22</span><span class="cal-day on">23</span><span class="cal-day on">24</span><span class="cal-day on">25</span>
              <span class="cal-day">26</span><span class="cal-day on">27</span><span class="cal-day on">28</span><span class="cal-day on">29</span><span class="cal-day on">30</span><span class="cal-day on">31</span>
            </div>
          </div>
        </div>
        <p class="center-note">Demo calendar — real scheduling (Cal.com) gets wired later.</p>
      </div>

      <div class="ct-panel reveal" id="panelMsg">
        <div class="form-card">
          <div class="form-row">
            <div class="field"><label>Name</label><input type="text" placeholder="Jane Doe" /></div>
            <div class="field"><label>Email</label><input type="email" placeholder="jane@example.com" /></div>
          </div>
          <div class="field"><label>Topic</label>
            <select><option>Select a topic</option><option>Full-time role</option><option>Product consulting</option><option>Just saying hi</option><option>Bug report</option><option>Other</option></select>
          </div>
          <div class="field"><label>Message</label><textarea placeholder="What would your project idea or just say hi..."></textarea></div>
          <label class="consent"><input type="checkbox" checked /> I agree to the processing of my data to handle this request.</label>
          <button class="btn btn-pill" onclick="showToast('Demo — sending gets wired later')">Send Message
            <span class="btn-arrow"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h13M12 6l6 6-6 6"/></svg></span></button>
        </div>
      </div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="motion.umd.js"></script>
  <script src="sprite.js"></script>
  <script src="components.js"></script>
  <script src="script.js"></script>
</body>
</html>
